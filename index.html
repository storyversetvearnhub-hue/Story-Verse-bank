<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StoryVerse Bank</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#222;
}

header{
background:#123b73;
color:white;
padding:22px;
text-align:center;
}

header h1{
font-size:27px;
margin-bottom:6px;
}

.container{
width:92%;
max-width:520px;
margin:25px auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
color:#123b73;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:9px;
border:none;
border-radius:8px;
background:#123b73;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.hidden{
display:none;
}

.balance{
background:#123b73;
color:white;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

.balance p{
font-size:14px;
margin-bottom:8px;
}

.balance strong{
font-size:30px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.actions button{
margin:0;
}

.message{
margin-top:15px;
padding:15px;
border-radius:10px;
background:#eef3f9;
font-size:14px;
}

.cancel{
background:#777;
}

.logout{
background:#c62828;
}

.small{
font-size:13px;
color:#666;
text-align:center;
margin-top:10px;
}

footer{
text-align:center;
padding:25px;
color:#777;
font-size:13px;
}

</style>
</head>

<body>

<header>

<h1>🏦 StoryVerse Bank</h1>

<p>Simple • Convenient • Connected</p>

</header>


<div class="container">


<!-- LOGIN / REGISTER -->

<div id="authSection">


<div class="card">

<h2>🔐 Customer Login</h2>

<input
type="email"
id="loginEmail"
placeholder="Email address"
>

<input
type="password"
id="loginPassword"
placeholder="Password"
>

<button onclick="loginUser()">
Login
</button>

<div id="loginMessage" class="message hidden"></div>

</div>


<div class="card">

<h2>📝 Create Account</h2>

<input
type="email"
id="registerEmail"
placeholder="Email address"
>

<input
type="password"
id="registerPassword"
placeholder="Password (minimum 6 characters)"
>

<button onclick="registerUser()">
Create Account
</button>

<div id="registerMessage" class="message hidden"></div>

</div>


</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">


<div class="balance">

<p>Available Balance</p>

<strong id="balanceAmount">
₦0.00
</strong>

</div>


<div class="card">

<h2>👤 My Account</h2>

<p>
Logged in as:
<strong id="userEmail">
Loading...
</strong>
</p>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

</div>


<div class="card">

<h2>🏦 Banking Services</h2>

<div class="actions">

<button onclick="deposit()">
💰 Deposit
</button>

<button onclick="withdraw()">
💸 Withdraw
</button>

<button onclick="transfer()">
🔄 Transfer
</button>

<button onclick="transactions()">
📜 Transactions
</button>

</div>

</div>


<div
id="serviceMessage"
class="message hidden"
></div>


</div>

</div>


<footer>

© 2026 StoryVerse Bank. All rights reserved.

</footer>


<!-- =============================== -->
<!-- FIREBASE -->
<!-- =============================== -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

getAuth,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

signOut,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ===============================
FIREBASE CONFIGURATION
=============================== */

const firebaseConfig = {

apiKey:"AIzaSyBbjVL5TMW8mjtqxxo9fxn7BCEl_872vW8",

authDomain:"story-verse-bank.firebaseapp.com",

projectId:"story-verse-bank",

storageBucket:"story-verse-bank.firebasestorage.app",

messagingSenderId:"6469827233",

appId:"1:6469827233:web:475887acf29097e3cd0ee0",

measurementId:"G-ZB8VQDSW3L"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ===============================
MESSAGE FUNCTION
=============================== */

function showMessage(id,text){

const element=document.getElementById(id);

if(!element)return;

element.textContent=text;

element.classList.remove("hidden");

}


/* ===============================
REGISTER
=============================== */

window.registerUser = async function(){

const email=
document.getElementById("registerEmail").value.trim();

const password=
document.getElementById("registerPassword").value;


if(!email||!password){

showMessage(
"registerMessage",
"Please enter your email and password."
);

return;

}


if(password.length<6){

showMessage(
"registerMessage",
"Password must contain at least 6 characters."
);

return;

}


try{

await createUserWithEmailAndPassword(
auth,
email,
password
);


showMessage(
"registerMessage",
"Account created successfully!"
);


}catch(error){

showMessage(
"registerMessage",
"Registration failed: "+error.message
);

}

};


/* ===============================
LOGIN
=============================== */

window.loginUser = async function(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;


if(!email||!password){

showMessage(
"loginMessage",
"Please enter your email and password."
);

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);


showMessage(
"loginMessage",
"Login successful!"
);


}catch(error){

showMessage(
"loginMessage",
"Login failed: "+error.message
);

}

};


/* ===============================
LOGOUT
=============================== */

window.logout = async function(){

try{

await signOut(auth);

}catch(error){

alert(
"Logout failed: "+error.message
);

}

};


/* ===============================
AUTH STATE
=============================== */

onAuthStateChanged(auth,function(user){

const authSection=
document.getElementById("authSection");

const dashboard=
document.getElementById("dashboard");

const userEmail=
document.getElementById("userEmail");


if(user){

authSection.classList.add("hidden");

dashboard.classList.remove("hidden");

userEmail.textContent=user.email;

}else{

authSection.classList.remove("hidden");

dashboard.classList.add("hidden");

}

});


/* ===============================
DEPOSIT
=============================== */

window.deposit=function(){

const message=
document.getElementById("serviceMessage");


message.classList.remove("hidden");


message.innerHTML=`

<div style="
background:white;
padding:18px;
border-radius:12px;
">

<h3 style="color:#123b73;margin-bottom:12px;">
💰 Make a Deposit
</h3>

<p>
Enter the amount you want to deposit.
</p>

<input
type="number"
id="depositAmount"
placeholder="Amount in ₦"
min="100"
>

<input
type="text"
id="depositReference"
placeholder="Payment reference (optional)"
>

<button onclick="submitDeposit()">
Submit Deposit Request
</button>

<button
onclick="closeService()"
class="cancel"
>
Cancel
</button>

<p style="
font-size:12px;
color:#666;
margin-top:10px;
">

Your balance will only be updated after the deposit has been verified.

</p>

</div>

`;

};


/* ===============================
SUBMIT DEPOSIT
=============================== */

window.submitDeposit=function(){

const amount=
Number(
document.getElementById("depositAmount").value
);


if(!amount||amount<100){

alert(
"Please enter a deposit amount of at least ₦100."
);

return;

}


alert(

"Deposit request submitted successfully.\n\n"+

"Amount: ₦"+
amount.toLocaleString()+

"\n\nYour deposit will be verified before your balance is updated."

);


closeService();

};


/* ===============================
WITHDRAWAL
=============================== */

window.withdraw=function(){

const message=
document.getElementById("serviceMessage");


message.classList.remove("hidden");


message.innerHTML=`

<div style="
background:white;
padding:18px;
border-radius:12px;
">

<h3 style="color:#123b73;margin-bottom:12px;">
💸 Request Withdrawal
</h3>

<p>
Enter your withdrawal details.
</p>

<input
type="number"
id="withdrawAmount"
placeholder="Amount in ₦"
min="100"
>

<input
type="text"
id="bankName"
placeholder="Bank name"
>

<input
type="text"
id="accountNumber"
placeholder="10-digit account number"
maxlength="10"
inputmode="numeric"
>

<input
type="text"
id="accountName"
placeholder="Account name"
>

<button onclick="submitWithdrawal()">
Submit Withdrawal Request
</button>

<button
onclick="closeService()"
class="cancel"
>
Cancel
</button>

<p style="
font-size:12px;
color:#666;
margin-top:10px;
">

Withdrawal requests must be verified before payment.

</p>

</div>

`;

};


/* ===============================
SUBMIT WITHDRAWAL
=============================== */

window.submitWithdrawal=function(){

const amount=
Number(
document.getElementById("withdrawAmount").value
);

const bank=
document.getElementById("bankName").value.trim();

const accountNumber=
document.getElementById("accountNumber").value.trim();

const accountName=
document.getElementById("accountName").value.trim();


if(!amount||amount<100){

alert(
"Please enter a withdrawal amount of at least ₦100."
);

return;

}


if(!bank){

alert("Please enter your bank name.");

return;

}


if(!/^\d{10}$/.test(accountNumber)){

alert(
"Please enter a valid 10-digit account number."
);

return;

}


if(!accountName){

alert(
"Please enter the account name."
);

return;

}


alert(

"Withdrawal request submitted successfully.\n\n"+

"Amount: ₦"+
amount.toLocaleString()+

"\nBank: "+bank+

"\nAccount: "+accountNumber+

"\nAccount Name: "+accountName+

"\n\nYour request will be verified before payment."

);


closeService();

};


/* ===============================
TRANSFER
=============================== */

window.transfer=function(){

const message=
document.getElementById("serviceMessage");


message.classList.remove("hidden");


message.innerHTML=`

<div style="
background:white;
padding:18px;
border-radius:12px;
">

<h3 style="color:#123b73;margin-bottom:12px;">
🔄 Transfer Money
</h3>

<p>
Enter the recipient details.
</p>

<input
type="email"
id="recipientEmail"
placeholder="Recipient email"
>

<input
type="number"
id="transferAmount"
placeholder="Amount in ₦"
min="100"
>

<input
type="text"
id="transferNote"
placeholder="Transfer note (optional)"
>

<button onclick="submitTransfer()">
Submit Transfer Request
</button>

<button
onclick="closeService()"
class="cancel"
>
Cancel
</button>

<p style="
font-size:12px;
color:#666;
margin-top:10px;
">

Transfers will require verification before money is moved.

</p>

</div>

`;

};


/* ===============================
SUBMIT TRANSFER
=============================== */

window.submitTransfer=function(){

const recipient=
document.getElementById("recipientEmail").value.trim();

const amount=
Number(
document.getElementById("transferAmount").value
);


if(!recipient){

alert(
"Please enter the recipient email."
);

return;

}


if(!amount||amount<100){

alert(
"Please enter a transfer amount of at least ₦100."
);

return;

}


alert(

"Transfer request submitted.\n\n"+

"Recipient: "+recipient+

"\nAmount: ₦"+
amount.toLocaleString()+

"\n\nThe transfer will be verified before money is moved."

);


closeService();

};


/* ===============================
TRANSACTIONS
=============================== */

window.transactions=function(){

const message=
document.getElementById("serviceMessage");


message.classList.remove("hidden");


message.innerHTML=`

<div style="
background:white;
padding:18px;
border-radius:12px;
">

<h3 style="color:#123b73;margin-bottom:12px;">
📜 Transaction History
</h3>

<p>
No transactions have been recorded yet.
</p>

<p style="
font-size:12px;
color:#666;
margin-top:10px;
">

Your verified deposits, withdrawals and transfers will appear here after the transaction database is connected.

</p>

<button
onclick="closeService()"
class="cancel"
>
Close
</button>

</div>

`;

};


/* ===============================
CLOSE SERVICE
=============================== */

window.closeService=function(){

const message=
document.getElementById("serviceMessage");


if(message){

message.classList.add("hidden");

message.innerHTML="";

}

};

</script>

</body>
  </html>
