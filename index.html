<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryVerse Bank</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #123b73;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      color: #123b73;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #123b73;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #555;
    }

    .danger {
      background: #c62828;
    }

    .balance {
      background: #123b73;
      color: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .balance h3 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .balance strong {
      font-size: 30px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions button {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #eef3f9;
      font-size: 14px;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏦 StoryVerse Bank</h1>
  <p>Simple • Secure • Convenient</p>
</header>

<div class="container">

  <!-- AUTHENTICATION -->
  <div id="authSection">

    <div class="card">
      <h2>🔐 Customer Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button onclick="loginUser()">Login</button>

      <div id="loginMessage" class="message hidden"></div>

      <p class="small">
        Don't have an account? Register below.
      </p>
    </div>

    <div class="card">
      <h2>📝 Create Account</h2>

      <input
        type="email"
        id="registerEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Password (minimum 6 characters)"
      >

      <button onclick="registerUser()">Create Account</button>

      <div id="registerMessage" class="message hidden"></div>
    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="balance">
      <h3>Available Balance</h3>
      <strong id="balanceAmount">₦0.00</strong>
    </div>

    <div class="card">
      <h2>👤 My Account</h2>

      <p>
        Logged in as:
        <strong id="userEmail">Loading...</strong>
      </p>

      <button class="danger" onclick="logout()">
        Logout
      </button>
    </div>


    <div class="card">
      <h2>💳 Banking Services</h2>

      <div class="actions">

        <button onclick="deposit()">
          💰 Deposit
        </button>

        <button onclick="withdraw()">
          💸 Withdraw
        </button>

        <button onclick="transfer()">
          🔄 Transfer
        </button>

        <button onclick="transactions()">
          📜 Transactions
        </button>

      </div>
    </div>


    <div id="serviceMessage" class="message hidden"></div>

  </div>

</div>


<footer>
  © 2026 StoryVerse Bank. All rights reserved.
</footer>


<!-- FIREBASE -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // YOUR FIREBASE CONFIGURATION

  const firebaseConfig = {

    apiKey: "AIzaSyBbjVL5TMW8mjtqxxo9fxn7BCEl_872vW8",

    authDomain: "story-verse-bank.firebaseapp.com",

    projectId: "story-verse-bank",

    storageBucket: "story-verse-bank.firebasestorage.app",

    messagingSenderId: "6469827233",

    appId: "1:6469827233:web:475887acf29097e3cd0ee0",

    measurementId: "G-ZB8VQDSW3L"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  // SHOW MESSAGE

  function showMessage(elementId, text) {

    const element = document.getElementById(elementId);

    if (!element) return;

    element.textContent = text;

    element.classList.remove("hidden");

  }


  // REGISTER

  window.registerUser = async function() {

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;


    if (!email || !password) {

      showMessage(
        "registerMessage",
        "Please enter your email and password."
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "registerMessage",
        "Password must contain at least 6 characters."
      );

      return;

    }


    try {

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage(
        "registerMessage",
        "Account created successfully!"
      );

    } catch (error) {

      showMessage(
        "registerMessage",
        "Registration failed: " + error.message
      );

    }

  };


  // LOGIN

  window.loginUser = async function() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter your email and password."
      );

      return;

    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage(
        "loginMessage",
        "Login successful!"
      );

    } catch (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message
      );

    }

  };


  // LOGOUT

  window.logout = async function() {

    try {

      await signOut(auth);

    } catch (error) {

      alert("Logout failed: " + error.message);

    }

  };


  // AUTH STATE

  onAuthStateChanged(auth, function(user) {

    const authSection =
      document.getElementById("authSection");

    const dashboard =
      document.getElementById("dashboard");

    const userEmail =
      document.getElementById("userEmail");


    if (user) {

      authSection.classList.add("hidden");

      dashboard.classList.remove("hidden");

      userEmail.textContent = user.email;

    } else {

      authSection.classList.remove("hidden");

      dashboard.classList.add("hidden");

    }

  });


// ===============================
// DEPOSIT SECTION
// ===============================

window.deposit = function () {

  const message = document.getElementById("serviceMessage");

  if (!message) {
    alert("Deposit section is not available.");
    return;
  }

  message.classList.remove("hidden");

  message.innerHTML = `
    <div style="
      background:white;
      padding:18px;
      border-radius:12px;
      margin-top:10px;
    ">

      <h3 style="color:#123b73; margin-bottom:12px;">
        💰 Make a Deposit
      </h3>

      <p style="margin-bottom:12px;">
        Enter the amount you want to deposit.
      </p>

      <input
        type="number"
        id="depositAmount"
        placeholder="Amount in ₦"
        min="100"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <input
        type="text"
        id="depositReference"
        placeholder="Payment reference (optional)"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <button onclick="submitDeposit()">
        Submit Deposit Request
      </button>

      <button onclick="closeDeposit()" style="background:#777;">
        Cancel
      </button>

      <p style="font-size:12px;color:#666;margin-top:12px;">
        Your balance will only be updated after the deposit has been verified.
      </p>

    </div>
  `;
};

window.submitDeposit = function () {

  const amountInput = document.getElementById("depositAmount");

  if (!amountInput) {
    alert("Deposit form is not available.");
    return;
  }

  const amount = Number(amountInput.value);

  if (!amount || amount < 100) {
    alert("Please enter a deposit amount of at least ₦100.");
    return;
  }

  alert(
    "Deposit request submitted successfully.\n\n" +
    "Amount: ₦" +
    amount.toLocaleString() +
    "\n\nYour deposit will be verified before your balance is updated."
  );

  closeDeposit();
};

window.closeDeposit = function () {

  const message = document.getElementById("serviceMessage");

  if (message) {
    message.classList.add("hidden");
    message.innerHTML = "";
  }

};

  // ===============================
// WITHDRAWAL SECTION
// ===============================

window.withdraw = function () {

  const message = document.getElementById("serviceMessage");

  if (!message) {
    alert("Withdrawal section is not available.");
    return;
  }

  message.classList.remove("hidden");

  message.innerHTML = `
    <div style="
      background:white;
      padding:18px;
      border-radius:12px;
      margin-top:10px;
    ">

      <h3 style="color:#123b73; margin-bottom:12px;">
        💸 Request Withdrawal
      </h3>

      <p style="margin-bottom:12px;">
        Enter the amount and your bank details.
      </p>

      <input
        type="number"
        id="withdrawAmount"
        placeholder="Amount in ₦"
        min="100"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <input
        type="text"
        id="bankName"
        placeholder="Bank name"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <input
        type="text"
        id="accountNumber"
        placeholder="Account number"
        maxlength="10"
        inputmode="numeric"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <input
        type="text"
        id="accountName"
        placeholder="Account name"
        style="
          width:100%;
          padding:13px;
          margin-bottom:10px;
          border:1px solid #ccc;
          border-radius:8px;
        "
      >

      <button onclick="submitWithdrawal()">
        Submit Withdrawal Request
      </button>

      <button
        onclick="closeWithdrawal()"
        style="background:#777;"
      >
        Cancel
      </button>

      <p style="
        font-size:12px;
        color:#666;
        margin-top:12px;
      ">
        Withdrawal requests must be verified before payment is made.
      </p>

    </div>
  `;
};


// SUBMIT WITHDRAWAL

window.submitWithdrawal = function () {

  const amount =
    Number(document.getElementById("withdrawAmount").value);

  const bankName =
    document.getElementById("bankName").value.trim();

  const accountNumber =
    document.getElementById("accountNumber").value.trim();

  const accountName =
    document.getElementById("accountName").value.trim();


  if (!amount || amount < 100) {
    alert("Please enter a withdrawal amount of at least ₦100.");
    return;
  }

  if (!bankName) {
    alert("Please enter your bank name.");
    return;
  }

  if (!/^\d{10}$/.test(accountNumber)) {
    alert("Please enter a valid 10-digit Nigerian account number.");
    return;
  }

  if (!accountName) {
    alert("Please enter the account name.");
    return;
  }


  alert(
    "Withdrawal request submitted successfully.\n\n" +
    "Amount: ₦" +
    amount.toLocaleString() +
    "\nBank: " +
    bankName +
    "\nAccount: " +
    accountNumber +
    "\nAccount Name: " +
    accountName +
    "\n\nYour request will be verified before payment."
  );


  closeWithdrawal();

};


// CLOSE WITHDRAWAL

window.closeWithdrawal = function () {

  const message =
    document.getElementById("serviceMessage");

  if (message) {

    message.classList.add("hidden");

    message.innerHTML = "";

  }

};



  // ===============================
// TRANSFER SECTION
// ===============================

window.transfer = function () {

  const message = document.getElementById("serviceMessage");

  if (!message) {
    alert("Transfer section is not available.");
    return;
  }

  message.innerHTML = `
    <div style="
      background:#ffffff;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    ">

      <h3>💸 Transfer Money</h3>

      <input
        type="text"
        id="transferAccount"
        placeholder="Recipient account number"
        style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        type="text"
        id="transferName"
        placeholder="Recipient name"
        style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        type="number"
        id="transferAmount"
        placeholder="Amount (₦)"
        style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <button
        onclick="processTransfer()"
        style="
          width:100%;
          padding:13px;
          margin-top:10px;
          background:#0d6efd;
          color:white;
          border:none;
          border-radius:8px;
          font-size:16px;
        "
      >
        Transfer Now
      </button>

      <p id="transferResult" style="margin-top:12px;"></p>

    </div>
  `;
};


// ===============================
// PROCESS TRANSFER
// ===============================

window.processTransfer = function () {

  const account = document.getElementById("transferAccount").value.trim();
  const name = document.getElementById("transferName").value.trim();
  const amount = Number(document.getElementById("transferAmount").value);
  const result = document.getElementById("transferResult");

  if (!account || !name || !amount) {
    result.innerHTML = "❌ Please fill in all transfer details.";
    result.style.color = "red";
    return;
  }

  if (amount <= 0) {
    result.innerHTML = "❌ Enter a valid transfer amount.";
    result.style.color = "red";
    return;
  }

  result.innerHTML = `
    ⏳ Transfer request submitted...<br>
    Recipient: ${name}<br>
    Account: ${account}<br>
    Amount: ₦${amount.toLocaleString()}
  `;

  result.style.color = "#0d6efd";

  // Firebase transfer processing will be connected here next.
};


  // ===============================
// TRANSACTION HISTORY
// ===============================

window.transactionHistory = function () {

  const message = document.getElementById("serviceMessage");

  if (!message) {
    alert("Transaction history section is not available.");
    return;
  }

  message.innerHTML = `
    <div style="
      background:#ffffff;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    ">

      <h3>📜 Transaction History</h3>

      <div id="transactionList">

        <div style="
          padding:12px;
          margin:8px 0;
          border-bottom:1px solid #eee;
        ">
          <strong>💸 Transfer</strong><br>
          <small>Transaction details will appear here.</small>
        </div>

        <div style="
          padding:12px;
          margin:8px 0;
          border-bottom:1px solid #eee;
        ">
          <strong>💰 Deposit</strong><br>
          <small>Transaction details will appear here.</small>
        </div>

      </div>

      <p style="
        text-align:center;
        color:#777;
        margin-top:15px;
      ">
        Your latest transactions will be displayed here.
      </p>

    </div>
  `;
};
