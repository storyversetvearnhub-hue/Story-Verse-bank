<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryVerse Bank</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #123b73;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      color: #123b73;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #123b73;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #555;
    }

    .danger {
      background: #c62828;
    }

    .balance {
      background: #123b73;
      color: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .balance h3 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .balance strong {
      font-size: 30px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions button {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #eef3f9;
      font-size: 14px;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏦 StoryVerse Bank</h1>
  <p>Simple • Secure • Convenient</p>
</header>

<div class="container">

  <!-- AUTHENTICATION -->
  <div id="authSection">

    <div class="card">
      <h2>🔐 Customer Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button onclick="loginUser()">Login</button>

      <div id="loginMessage" class="message hidden"></div>

      <p class="small">
        Don't have an account? Register below.
      </p>
    </div>

    <div class="card">
      <h2>📝 Create Account</h2>

      <input
        type="email"
        id="registerEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Password (minimum 6 characters)"
      >

      <button onclick="registerUser()">Create Account</button>

      <div id="registerMessage" class="message hidden"></div>
    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="balance">
      <h3>Available Balance</h3>
      <strong id="balanceAmount">₦0.00</strong>
    </div>

    <div class="card">
      <h2>👤 My Account</h2>

      <p>
        Logged in as:
        <strong id="userEmail">Loading...</strong>
      </p>

      <button class="danger" onclick="logout()">
        Logout
      </button>
    </div>


    <div class="card">
      <h2>💳 Banking Services</h2>

      <div class="actions">

        <button onclick="deposit()">
          💰 Deposit
        </button>

        <button onclick="withdraw()">
          💸 Withdraw
        </button>

        <button onclick="transfer()">
          🔄 Transfer
        </button>

        <button onclick="transactions()">
          📜 Transactions
        </button>

      </div>
    </div>


    <div id="serviceMessage" class="message hidden"></div>

  </div>

</div>


<footer>
  © 2026 StoryVerse Bank. All rights reserved.
</footer>


<!-- FIREBASE -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // YOUR FIREBASE CONFIGURATION

  const firebaseConfig = {

    apiKey: "AIzaSyBbjVL5TMW8mjtqxxo9fxn7BCEl_872vW8",

    authDomain: "story-verse-bank.firebaseapp.com",

    projectId: "story-verse-bank",

    storageBucket: "story-verse-bank.firebasestorage.app",

    messagingSenderId: "6469827233",

    appId: "1:6469827233:web:475887acf29097e3cd0ee0",

    measurementId: "G-ZB8VQDSW3L"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  // SHOW MESSAGE

  function showMessage(elementId, text) {

    const element = document.getElementById(elementId);

    if (!element) return;

    element.textContent = text;

    element.classList.remove("hidden");

  }


  // REGISTER

  window.registerUser = async function() {

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;


    if (!email || !password) {

      showMessage(
        "registerMessage",
        "Please enter your email and password."
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "registerMessage",
        "Password must contain at least 6 characters."
      );

      return;

    }


    try {

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage(
        "registerMessage",
        "Account created successfully!"
      );

    } catch (error) {

      showMessage(
        "registerMessage",
        "Registration failed: " + error.message
      );

    }

  };


  // LOGIN

  window.loginUser = async function() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter your email and password."
      );

      return;

    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage(
        "loginMessage",
        "Login successful!"
      );

    } catch (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message
      );

    }

  };


  // LOGOUT

  window.logout = async function() {

    try {

      await signOut(auth);

    } catch (error) {

      alert("Logout failed: " + error.message);

    }

  };


  // AUTH STATE

  onAuthStateChanged(auth, function(user) {

    const authSection =
      document.getElementById("authSection");

    const dashboard =
      document.getElementById("dashboard");

    const userEmail =
      document.getElementById("userEmail");


    if (user) {

      authSection.classList.add("hidden");

      dashboard.classList.remove("hidden");

      userEmail.textContent = user.email;

    } else {

      authSection.classList.remove("hidden");

      dashboard.classList.add("hidden");

    }

  });


  // DEMO BANK FUNCTIONS

  window.deposit = function() {

    showMessage(
      "serviceMessage",
      "Deposit feature will be connected to the banking database next."
    );

  };


  window.withdraw = function() {

    showMessage(
      "serviceMessage",
      "Withdrawal feature will be connected to the banking database next."
    );

  };


  window.transfer = function() {

    showMessage(
      "serviceMessage",
      "Transfer feature will be connected to the banking database next."
    );

  };


  window.transactions = function() {

    showMessage(
      "serviceMessage",
      "Transaction history will be connected next."
    );

  };

</script>

</body>
    </html>
